[project]
name = "ridedeck-backend"
version = "0.1.0"
description = "RideDeck — competitive Cardfight!! Vanguard platform (backend)"
requires-python = ">=3.13"
dependencies = [
    "Django==5.1.5",
    "djangorestframework==3.15.2",
    "djangorestframework-simplejwt==5.4.0",
    "django-filter==24.3",
    "django-cors-headers==4.6.0",
    "drf-spectacular==0.28.0",
    "psycopg[binary]==3.2.3",
    "celery==5.4.0",
    "redis==5.2.1",
    "django-redis==5.4.0",
    "Pillow==11.1.0",
    "python-dotenv==1.0.1",
    "structlog==24.4.0",
    "requests==2.32.3",
    "gunicorn==23.0.0",
    "whitenoise==6.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-django==4.9.0",
    "pytest-cov==6.0.0",
    "factory-boy==3.3.1",
    "ruff==0.9.2",
    "model-bakery==1.20.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations", ".venv", "venv", "staticfiles", "mediafiles"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--reuse-db --ds=config.settings.test"
