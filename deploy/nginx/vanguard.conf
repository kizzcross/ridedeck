# Nginx on the host (outside Docker), same box as pokefit.
# Install:
#   sudo cp deploy/nginx/vanguard.conf /etc/nginx/sites-available/vanguard
#   sudo ln -sf /etc/nginx/sites-available/vanguard /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# TLS:
#   sudo certbot --nginx -d vanguard.kizzcross.com.br

upstream vanguard_app {
    server 127.0.0.1:8002;
}

server {
    listen 80;
    listen [::]:80;
    server_name vanguard.kizzcross.com.br;

    client_max_body_size 20M;

    # Django collected static (admin, DRF). The SPA's own /assets/ are served
    # by the app via WhiteNoise, so they fall through to the proxy below.
    location /static/ {
        alias /var/www/vanguard/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/vanguard/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://vanguard_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}
