# Production on the Hetzner VPS (178.105.169.230), same box as pokefit.
# vanguard.kizzcross.com.br → nginx (host) → 127.0.0.1:8002 → web container.
#
# Usage:
#   cd deploy && cp .env.production.example .env && nano .env
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vanguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vanguard}
    volumes:
      - vg_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vanguard}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Bound to localhost only; nginx on the host terminates TLS and proxies.
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - /var/www/vanguard/media:/app/mediafiles
      - /var/www/vanguard/static:/app/staticfiles

  celery-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    entrypoint: []
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    depends_on:
      - db
      - redis

  celery-beat:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    entrypoint: []
    command: ["celery", "-A", "config", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]
    depends_on:
      - db
      - redis

volumes:
  vg_pgdata:
