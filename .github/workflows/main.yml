name: main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    # Postgres is required by the test settings (no sqlite fallback).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ridedeck
          POSTGRES_USER: ridedeck
          POSTGRES_PASSWORD: ridedeck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ridedeck"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ridedeck
      POSTGRES_USER: ridedeck
      POSTGRES_PASSWORD: ridedeck
      REDIS_URL: redis://127.0.0.1:6379/0
      # CI-only, never used in production.
      DJANGO_SECRET_KEY: vanguard-github-actions-ci-only-not-for-production-0123456789
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,vanguard.kizzcross.com.br

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ---- Backend ----
      - name: Backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        working-directory: backend
        run: ruff check apps config

      - name: Check migrations
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: python manage.py makemigrations --check --dry-run

      - name: Django deploy checks
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
        run: python manage.py check --deploy --fail-level ERROR

      - name: Backend tests
        working-directory: backend
        run: pytest -q

      # ---- Frontend ----
      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Frontend tests
        working-directory: frontend
        run: npm test

  deploy:
    name: Deploy to Hetzner
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate deploy secrets
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "::error::Configure repository secret DEPLOY_HOST (ex: 178.105.169.230)"; exit 1
          fi
          if [ -z "${{ secrets.DEPLOY_USER }}" ]; then
            echo "::error::Configure repository secret DEPLOY_USER (ex: root)"; exit 1
          fi
          if [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "::error::Configure repository secret DEPLOY_SSH_KEY with the full PRIVATE key"; exit 1
          fi
          if ! printf '%s' "${{ secrets.DEPLOY_SSH_KEY }}" | grep -q "BEGIN.*PRIVATE KEY"; then
            echo "::error::DEPLOY_SSH_KEY must be the private key (BEGIN ... PRIVATE KEY), not the .pub file"; exit 1
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          port: 22
          script_stop: true
          command_timeout: 40m
          # Isolated from pokefit: own path, own compose file, own containers/port (8002).
          script: |
            set -euo pipefail
            cd /opt/vanguard
            git fetch origin main
            git reset --hard origin/main
            cd deploy
            docker compose -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.prod.yml ps
